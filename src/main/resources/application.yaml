spring:
  application:
    name: careertrack-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careertrack_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: careertrack-backend
    access-token-minutes: 60

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}